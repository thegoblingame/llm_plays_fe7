<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FE7 Overlay</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <div class="column left">
      <section class="feed" id="feed"></section>
      <!-- Unrecruited units, two columns, on the carton's white panel. -->
      <div class="milk" id="milk"><div class="tiles" id="unrecruited"></div></div>
    </div>

    <!-- Dead units, two rows, on the stone face. -->
    <div class="rip" id="rip"><div class="tiles" id="dead"></div></div>

    <div class="column right">
      <section class="roster" id="roster"></section>
    </div>

    <script src="/overlay.js"></script>
  </body>
</html>
